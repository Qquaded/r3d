name: Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            artifact-name: r3d-windows

          - os: ubuntu-latest
            os-name: Linux
            artifact-name: r3d-linux

          - os: macos-latest
            os-name: macOS
            artifact-name: r3d-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Linux system dependencies ──────────────────────────────────────────
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            ninja-build

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      # ── Configure ─────────────────────────────────────────────────────────
      # Windows: -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON is required so MSVC
      # actually emits a DLL instead of just a static .lib. Without it,
      # BUILD_SHARED_LIBS=ON still produces a .lib-only output for libraries
      # that don't have explicit __declspec(dllexport) annotations everywhere.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cmake -S . -B build ^
            -G "Visual Studio 17 2022" -A x64 ^
            -DBUILD_SHARED_LIBS=ON ^
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON ^
            -DR3D_RAYLIB_VENDORED=ON ^
            -DR3D_ASSIMP_VENDORED=ON ^
            -DR3D_BUILD_EXAMPLES=OFF ^
            -DR3D_BUILD_DOCS=OFF

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DR3D_RAYLIB_VENDORED=ON \
            -DR3D_ASSIMP_VENDORED=ON \
            -DR3D_BUILD_EXAMPLES=OFF \
            -DR3D_BUILD_DOCS=OFF

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      # ── Debug: list everything produced ───────────────────────────────────
      - name: List build outputs (Unix)
        if: runner.os != 'Windows'
        run: find build/bin build/lib -type f 2>/dev/null | sort || true

      - name: List build outputs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build/bin, build/lib -ErrorAction SilentlyContinue |
            Where-Object { -not $_.PSIsContainer } |
            Select-Object -ExpandProperty FullName

      # ── Upload artifacts ───────────────────────────────────────────────────
      # Windows: DLLs → build\bin\Release\   import libs → build\lib\Release\
      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            build/bin/Release/*.dll
            build/lib/Release/*.lib
          if-no-files-found: error

      # Linux: shared objects → build/lib/
      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: build/lib/*.so*
          if-no-files-found: error

      # macOS: dylibs → build/lib/
      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: build/lib/*.dylib
          if-no-files-found: error
